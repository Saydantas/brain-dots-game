name: Build Google Play Store Bundle (.aab)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android App Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: |
          cd google-play-package/android-source || cd android-source || true
          chmod +x ./gradlew || true

      - name: Build Android App Bundle (.aab)
        working-directory: google-play-package/android-source
        run: |
          ./gradlew bundleRelease --stacktrace

      - name: Build Universal APK (Para Teste Direto no Celular)
        working-directory: google-play-package/android-source
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Upload .AAB Artifact (Para Enviar ao Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: google-play-bundle-aab
          path: google-play-package/android-source/app/build/outputs/bundle/release/*.aab

      - name: Upload .APK Artifact (Para Testar no Celular)
        uses: actions/upload-artifact@v4
        with:
          name: brain-dots-apk
          path: google-play-package/android-source/app/build/outputs/apk/release/*.apk
