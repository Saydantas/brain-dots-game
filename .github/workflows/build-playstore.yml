name: Build Google Play Store Bundle (.aab)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android App Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Check directory and build
        run: |
          if [ -d "google-play-package/android-source" ]; then
            cd google-play-package/android-source
          elif [ -d "android-source" ]; then
            cd android-source
          fi
          gradle wrapper
          ./gradlew bundleRelease --stacktrace
          ./gradlew assembleRelease --stacktrace

      - name: Upload .AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: google-play-bundle-aab
          path: "**/app/build/outputs/bundle/release/*.aab"

      - name: Upload .APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: brain-dots-apk
          path: "**/app/build/outputs/apk/release/*.apk"
