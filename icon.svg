<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Fundo do ícone com borda suave -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" stroke="#1e293b" stroke-width="8" />
  
  <!-- Linhas neon clássicas de traço contínuo -->
  <line x1="128" y1="128" x2="384" y2="128" stroke="#06b6d4" stroke-width="20" stroke-linecap="round" filter="url(#glow)" />
  <line x1="384" y1="128" x2="128" y2="384" stroke="#8b5cf6" stroke-width="20" stroke-linecap="round" filter="url(#glow)" />
  <line x1="128" y1="384" x2="384" y2="384" stroke="#ec4899" stroke-width="20" stroke-linecap="round" filter="url(#glow)" />
  <line x1="384" y1="384" x2="256" y2="256" stroke="#10b981" stroke-width="20" stroke-linecap="round" filter="url(#glow)" />

  <!-- Pontos vermelhos clássicos -->
  <circle cx="128" cy="128" r="30" fill="#ef4444" stroke="#ffffff" stroke-width="6" />
  <circle cx="256" cy="128" r="30" fill="#ef4444" stroke="#ffffff" stroke-width="6" />
  <circle cx="384" cy="128" r="30" fill="#ef4444" stroke="#ffffff" stroke-width="6" />

  <circle cx="128" cy="256" r="30" fill="#ef4444" stroke="#ffffff" stroke-width="6" />
  <circle cx="256" cy="256" r="34" fill="#f59e0b" stroke="#ffffff" stroke-width="7" />
  <circle cx="384" cy="256" r="30" fill="#ef4444" stroke="#ffffff" stroke-width="6" />

  <circle cx="128" cy="384" r="30" fill="#ef4444" stroke="#ffffff" stroke-width="6" />
  <circle cx="256" cy="384" r="30" fill="#ef4444" stroke="#ffffff" stroke-width="6" />
  <circle cx="384" cy="384" r="30" fill="#ef4444" stroke="#ffffff" stroke-width="6" />
</svg>
